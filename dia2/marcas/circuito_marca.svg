<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" font-family="Helvetica, Arial, sans-serif" fill="#222">
  <title>Circuito 1: la marca, en el canal 1 del osciloscopio</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="760" height="580" fill="#fff"/>

  <text x="24" y="36" font-size="20" font-weight="700">Circuito 1 · La marca, en el canal 1</text>
  <text x="24" y="60" font-size="14" fill="#555">Un LED entre 5 V y TX, que se prende con cada marca</text>

  <!-- pincho USB-TTL -->
  <rect x="24" y="110" width="150" height="190" rx="8" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
  <text x="38" y="136" font-size="14" font-weight="700">Pincho USB-TTL</text>
  <text x="38" y="154" font-size="12" fill="#555">(a la notebook por USB)</text>
  <g font-size="13" text-anchor="end">
    <text x="164" y="184">5V</text>
    <text x="164" y="214">TXD</text>
    <text x="164" y="244">RXD</text>
    <text x="164" y="274">GND</text>
  </g>

  <!-- cables del pincho -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g opacity="0.45">
      <path d="M174 240 H204" stroke="#555" stroke-width="6"/>
      <path d="M174 240 H204" stroke="#009E73" stroke-width="4"/>
    </g>
    <path d="M174 180 H250 V130 H290" stroke="#555" stroke-width="6"/>
    <path d="M174 180 H250 V130 H290" stroke="#E69F00" stroke-width="4"/>
    <path d="M174 210 H520" stroke="#555" stroke-width="6"/>
    <path d="M174 210 H520" stroke="#F0E442" stroke-width="4"/>
    <path d="M174 270 H600" stroke="#555" stroke-width="6"/>
    <path d="M174 270 H600" stroke="#0072B2" stroke-width="4"/>
  </g>
  <g font-size="12" fill="#777">
    <text x="182" y="172">naranja</text>
    <text x="182" y="202">amarillo</text>
    <text x="212" y="244">verde · sin usar</text>
    <text x="182" y="290">azul</text>
  </g>

  <!-- resistencia y LED -->
  <rect x="290" y="120" width="80" height="20" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="330" y="110" font-size="14" text-anchor="middle">270 Ω</text>
  <g fill="none" stroke="#222" stroke-width="2.5">
    <path d="M370 130 H420"/>
    <path d="M450 130 H520 V210"/>
    <path d="M450 115 V145"/>
  </g>
  <path d="M420 115 L420 145 L450 130 Z" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <g stroke="#222" stroke-width="1.8" marker-end="url(#flecha)">
    <line x1="434" y1="114" x2="446" y2="98"/>
    <line x1="444" y1="118" x2="456" y2="102"/>
  </g>
  <text x="462" y="104" font-size="14" font-weight="700">LED</text>
  <text x="416" y="162" font-size="11" fill="#555" text-anchor="end">pata larga</text>
  <text x="454" y="162" font-size="11" fill="#555">pata corta</text>

  <!-- punta del osciloscopio -->
  <path d="M520 210 H600" fill="none" stroke="#222" stroke-width="2.5"/>
  <circle cx="520" cy="210" r="4.5"/>

  <!-- osciloscopio -->
  <rect x="600" y="180" width="140" height="120" rx="8" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
  <circle cx="600" cy="210" r="4.5" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="600" cy="270" r="4.5" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="610" y="214" font-size="12" fill="#555">punta</text>
  <text x="610" y="274" font-size="12" fill="#555">masa</text>
  <text x="676" y="236" font-size="14" font-weight="700" text-anchor="middle">Osciloscopio</text>
  <text x="676" y="256" font-size="14" text-anchor="middle">CH1</text>

  <!-- qué se ve -->
  <line x1="24" y1="325" x2="736" y2="325" stroke="#ddd" stroke-width="1.5"/>
  <text x="24" y="354" font-size="15" font-weight="700">Qué muestra el canal 1</text>
  <g stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="360" y1="368" x2="360" y2="480"/>
    <line x1="500" y1="368" x2="500" y2="480"/>
  </g>
  <text x="24" y="392" font-size="13" font-weight="700">en el cable</text>
  <text x="24" y="408" font-size="11" fill="#555">5 V en reposo, 0 V con la marca</text>
  <path d="M210 380 H360 V410 H500 V380 H700" fill="none" stroke="#222" stroke-width="2.5"/>
  <text x="24" y="452" font-size="13" font-weight="700">en el osciloscopio</text>
  <text x="24" y="468" font-size="11" fill="#555">con el CH1 invertido</text>
  <path d="M210 470 H360 V440 H500 V470 H700" fill="none" stroke="#0072B2" stroke-width="2.5"/>
  <text x="430" y="432" font-size="12" font-weight="700" text-anchor="middle">marca · LED prendido</text>

  <g font-size="12" fill="#444">
    <text x="24" y="508">En el pincho la lógica es al revés: TX está en alto en reposo y la marca lo lleva a 0 V. Por eso el LED va</text>
    <text x="24" y="524">entre 5 V y TX, y se prende cuando TX baja. Y por eso invertimos el canal: así la marca se ve hacia arriba.</text>
    <text x="24" y="540">Es cosa del puerto serie, no de toda marca TTL: las cajas de triggers de un EEG suelen mandar pulsos positivos.</text>
  </g>
  <text x="24" y="566" font-size="11" fill="#777">Los colores de los cables son los del pincho que usamos. En otros cambian: guíense por lo que dice impreso al lado de cada pin.</text>
</svg>
